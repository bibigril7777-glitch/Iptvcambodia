<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPTVkhmer - Version 4.0</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
:root{
  --bg:#070b12;
  --card:#101722;
  --card2:#151e2b;
  --text:#f5f7fa;
  --muted:#8e9aaa;
  --red:#ff1744;
  --green:#00e676;
  --blue:#2979ff;
  --border:#263244;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:linear-gradient(135deg,#05080d,#0b111b);
  color:var(--text);
  font-family:Arial,"Noto Sans Khmer",sans-serif;
  min-height:100vh;
}

header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(5,8,13,.96);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  padding:14px 18px;
}

.header{
  max-width:1400px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  font-size:24px;
  font-weight:800;
}

.logo span{
  color:var(--red);
}

.version{
  color:var(--muted);
  font-size:12px;
  margin-left:5px;
}

.status{
  display:flex;
  align-items:center;
  gap:7px;
  font-size:13px;
  color:var(--muted);
}

.dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 10px var(--green);
}

main{
  max-width:1400px;
  margin:auto;
  padding:18px;
}

.player-box{
  background:#000;
  border:1px solid var(--border);
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 15px 50px rgba(0,0,0,.45);
}

video{
  display:block;
  width:100%;
  height:min(68vh,700px);
  background:#000;
  object-fit:contain;
}

.player-info{
  background:#0c121c;
  padding:12px 15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.now-playing{
  font-weight:700;
}

.player-message{
  color:var(--muted);
  font-size:13px;
}

.controls{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:18px 0;
}

input{
  flex:1;
  min-width:220px;
  background:var(--card);
  border:1px solid var(--border);
  color:white;
  padding:12px 14px;
  border-radius:10px;
  outline:none;
}

input:focus{
  border-color:var(--blue);
}

button{
  border:0;
  color:white;
  background:var(--card2);
  border:1px solid var(--border);
  padding:11px 15px;
  border-radius:9px;
  cursor:pointer;
  font-weight:600;
}

button:hover{
  background:#202c3d;
}

button.active{
  background:var(--red);
  border-color:var(--red);
}

.country-bar{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:10px;
  margin-bottom:15px;
}

.country-bar button{
  white-space:nowrap;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:12px;
}

.channel{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
  cursor:pointer;
  transition:.2s;
}

.channel:hover{
  transform:translateY(-2px);
  border-color:#43536b;
}

.channel.active{
  border:2px solid var(--red);
}

.channel-logo{
  height:105px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#0b111a;
  overflow:hidden;
}

.channel-logo img{
  width:75px;
  height:75px;
  object-fit:contain;
}

.logo-fallback{
  font-size:32px;
  font-weight:800;
  color:var(--red);
}

.channel-body{
  padding:11px;
}

.channel-name{
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.channel-country{
  color:var(--muted);
  font-size:12px;
  margin-top:4px;
}

.badge{
  display:inline-block;
  margin-top:8px;
  font-size:10px;
  color:#00e676;
  border:1px solid #075c36;
  padding:3px 6px;
  border-radius:20px;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:40px 10px;
  display:none;
}

footer{
  text-align:center;
  color:#667386;
  font-size:12px;
  padding:30px 15px;
}

@media(max-width:700px){
  .header{
    align-items:flex-start;
  }

  .status{
    font-size:11px;
  }

  video{
    height:40vh;
  }

  .grid{
    grid-template-columns:repeat(2,1fr);
    gap:8px;
  }

  .channel-logo{
    height:85px;
  }

  .channel-logo img{
    width:60px;
    height:60px;
  }

  main{
    padding:10px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header">
    <div>
      <div class="logo">
        <span>IPTV</span>khmer
        <small class="version">v4.0</small>
      </div>
    </div>

    <div class="status">
      <span class="dot"></span>
      <span id="connectionStatus">Ready</span>
    </div>
  </div>
</header>

<main>

  <section class="player-box">
    <video id="video" controls playsinline></video>

    <div class="player-info">
      <div>
        <div class="now-playing" id="nowPlaying">
          ជ្រើសរើសប៉ុស្តិ៍
        </div>
        <div class="player-message" id="playerMessage">
          Ready to play
        </div>
      </div>

      <button onclick="reloadCurrent()">
        ↻ Reload
      </button>
    </div>
  </section>

  <div class="controls">
    <input
      id="search"
      type="search"
      placeholder="ស្វែងរកប៉ុស្តិ៍..."
      oninput="renderChannels()"
    >

    <button onclick="refreshAll()">
      🔄 Update
    </button>
  </div>

  <div class="country-bar" id="countries"></div>

  <div class="grid" id="channels"></div>

  <div class="empty" id="empty">
    មិនមានប៉ុស្តិ៍ដែលត្រូវនឹងការស្វែងរកទេ។
  </div>

</main>

<footer>
  IPTVkhmer v4.0 — HLS Player + Auto Reconnect + Auto Update
</footer>
